name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: praetoria
          POSTGRES_PASSWORD: praetoria
          POSTGRES_DB: praetoria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praetoria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://praetoria:praetoria@localhost:5432/praetoria?schema=public
      SIGNED_LINK_SECRET: ci-signed-link-secret-0123456789
      AUTH_SECRET: ci-auth-secret-0123456789
      WHATSAPP_BUSINESS_NUMBER: "34600000000"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=critical
        continue-on-error: true
