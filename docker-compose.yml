# Local development infrastructure. `docker compose up -d` then `npm run db:migrate`.
services:
  db:
    image: postgres:16-alpine
    container_name: praetoria-db
    environment:
      POSTGRES_USER: praetoria
      POSTGRES_PASSWORD: praetoria
      POSTGRES_DB: praetoria
    ports:
      - "5432:5432"
    volumes:
      - praetoria-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praetoria -d praetoria"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  praetoria-db-data:
